[package]
name = "lci"
version = "0.10.5"
edition = "2021"
authors = ["Justin J. Meza <justin.meza@gmail.com>", "Contributors"]
description = "A LOLCODE interpreter written in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/justinmeza/lci"
homepage = "http://lolcode.org"
keywords = ["lolcode", "interpreter", "language"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
